<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS v2 — Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #070c14; color: #cfe9ff; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100vh; gap: 24px; padding: 24px; }
    h1 { font-size: 20px; letter-spacing: 2px; color: #00d4ff; }
    #orb { width: 120px; height: 120px; border-radius: 50%;
           border: 3px solid #00d4ff44; display: grid; place-items: center;
           font-size: 13px; transition: all .3s; }
    #orb.on  { border-color: #00d4ff; box-shadow: 0 0 40px #00d4ff55; }
    #orb.bot { border-color: #7CFC00; box-shadow: 0 0 40px #7CFC0055; }
    /* Presence Engine — um visual por estado */
    #orb.listening      { border-color: #00d4ff; box-shadow: 0 0 40px #00d4ff66; }
    #orb.thinking       { border-color: #ffb347; box-shadow: 0 0 40px #ffb34766;
                          animation: pulse 1.2s infinite; }
    #orb.speaking       { border-color: #7CFC00; box-shadow: 0 0 46px #7CFC0077; }
    #orb.executing_tool { border-color: #cc66ff; box-shadow: 0 0 46px #cc66ff77;
                          animation: pulse .8s infinite; }
    #orb.error_recovery { border-color: #ff4455; box-shadow: 0 0 40px #ff445588; }
    #orb.idle           { border-color: #33475a; box-shadow: none; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    #detail { font-size: 12px; color: #9fd8ff; min-height: 16px; }
    button { background: #00d4ff; color: #04121f; border: 0; padding: 14px 34px;
             border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .4; }
    #log { font-size: 12px; color: #6d8aa5; max-width: 480px; text-align: center;
           white-space: pre-line; }
    #err { font-size: 13px; color: #ff6b7a; max-width: 480px; text-align: center;
           white-space: pre-line; word-break: break-word; }
    .badge { font-size: 11px; color: #7CFC00; }
  </style>
</head>
<body>
  <h1>JARVIS v2 — TESTE DE VOZ</h1>
  <div id="orb">off</div>
  <div id="detail"></div>
  <button id="btn">Conectar</button>
  <div class="badge" id="aec"></div>
  <div id="log">Fone de ouvido recomendado para o primeiro teste.\nCom caixas, o cancelamento de eco do navegador é ativado explicitamente.</div>
  <div id="err"></div>
  <audio id="botaudio" autoplay playsinline></audio>

<script>
// Diagnóstico visível: NENHUM erro pode morrer em silêncio (Safari!).
(function () {
  var box = function () { return document.getElementById('err'); };
  window.onerror = function (msg, src, line) {
    box().textContent = '⚠ JS: ' + msg + ' (linha ' + line + ')';
    return false;
  };
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason || {};
    box().textContent = '⚠ Promessa: ' + (r.name ? r.name + ': ' : '') +
                        (r.message || String(r));
  });
})();
</script>

<script>
const btn = document.getElementById('btn');
const orb = document.getElementById('orb');
const log = (t) => document.getElementById('log').textContent = t;
let pc = null;

btn.onclick = async () => {
  if (pc) { pc.close(); pc = null; btn.textContent = 'Conectar'; orb.className=''; orb.textContent='off'; return; }
  btn.disabled = true;
  try {
    // O ponto central deste cliente: processamento do navegador LIGADO
    // explicitamente (o cliente pré-pronto não define nada).
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl:  true,
        channelCount: 1,
      }
    });
    const track = stream.getAudioTracks()[0];
    const st = track.getSettings();
    document.getElementById('aec').textContent =
      `AEC=${st.echoCancellation} NS=${st.noiseSuppression} AGC=${st.autoGainControl}`;

    pc = new RTCPeerConnection();
    pc.addTrack(track, stream);
    pc.addTransceiver('audio', { direction: 'recvonly' });

    // ── HUD ao vivo: Presence Engine do servidor → data channel ──────────
    const STATE_PT = {
      idle: 'em espera', listening: 'ouvindo', thinking: 'pensando',
      speaking: 'falando', executing_tool: 'executando',
      observing_screen: 'observando tela', proactive_waiting: 'de prontidão',
      error_recovery: 'recuperando',
    };
    const dc = pc.createDataChannel('jarvis');
    dc.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type !== 'jarvis-state') return;      // ignora outros protocolos
      orb.className = m.state;
      orb.textContent = STATE_PT[m.state] || m.state;
      document.getElementById('detail').textContent =
        m.state === 'executing_tool' && m.detail ? `🔧 ${m.detail}` :
        (m.detail || '');
    };
    pc.ontrack = (e) => {
      const a = document.getElementById('botaudio');
      a.srcObject = e.streams[0];
      a.play().catch(() => {});   // iOS: garante playback pós-gesto
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') { orb.className='on'; orb.textContent='ouvindo'; log('Conectado — fale naturalmente. Interrompa falando por cima.'); }
      if (['failed','disconnected','closed'].includes(pc.connectionState)) { orb.className=''; orb.textContent='off'; }
    };

    log('Criando oferta WebRTC…');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log('Coletando candidatos ICE…');
    // vanilla ICE: espera terminar a coleta (com teto de 4s — host candidates
    // locais chegam em ms; STUN inacessível não pode travar o fluxo)
    await new Promise((res) => {
      const t = setTimeout(res, 4000);
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); return res(); }
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
      });
    });

    log('Enviando oferta ao servidor…');
    // Aberto por file:// (duplo clique)? Aponta para o servidor local
    // explicitamente — o CORS do runner é liberado.
    const base = window.location.protocol === 'file:'
        ? 'http://localhost:7860' : window.location.origin;
    const url = base + '/api/offer';
    let resp;
    try {
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
      });
    } catch (fe) {
      throw new Error(`fetch para ${url} falhou (${fe.name}: ${fe.message}). ` +
        'Verifique extensões (adblock), modo "somente HTTPS" do Chrome, ' +
        'ou recarregue com Ctrl+Shift+R.');
    }
    if (!resp.ok) throw new Error(`servidor respondeu ${resp.status}`);
    log('Aplicando resposta…');
    const answer = await resp.json();
    await pc.setRemoteDescription(answer);
    btn.textContent = 'Desconectar';
  } catch (e) {
    document.getElementById('err').textContent =
      '⚠ ' + (e.name ? e.name + ': ' : '') + e.message;
    log('Falhou — leia o erro acima e me mande.');
    if (pc) { pc.close(); pc = null; }
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
