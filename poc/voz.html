<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS v2 — Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #070c14; color: #cfe9ff; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100vh; gap: 24px; padding: 24px; }
    h1 { font-size: 20px; letter-spacing: 2px; color: #00d4ff; }
    #orb { width: 120px; height: 120px; border-radius: 50%;
           border: 3px solid #00d4ff44; display: grid; place-items: center;
           font-size: 13px; transition: all .3s; }
    #orb.on  { border-color: #00d4ff; box-shadow: 0 0 40px #00d4ff55; }
    #orb.bot { border-color: #7CFC00; box-shadow: 0 0 40px #7CFC0055; }
    /* Presence Engine — um visual por estado */
    #orb.listening      { border-color: #00d4ff; box-shadow: 0 0 40px #00d4ff66; }
    #orb.thinking       { border-color: #ffb347; box-shadow: 0 0 40px #ffb34766;
                          animation: pulse 1.2s infinite; }
    #orb.speaking       { border-color: #7CFC00; box-shadow: 0 0 46px #7CFC0077; }
    #orb.executing_tool { border-color: #cc66ff; box-shadow: 0 0 46px #cc66ff77;
                          animation: pulse .8s infinite; }
    #orb.error_recovery { border-color: #ff4455; box-shadow: 0 0 40px #ff445588; }
    #orb.idle           { border-color: #33475a; box-shadow: none; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    #detail { font-size: 12px; color: #9fd8ff; min-height: 16px; }
    button { background: #00d4ff; color: #04121f; border: 0; padding: 14px 34px;
             border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .4; }
    #log { font-size: 12px; color: #6d8aa5; max-width: 480px; text-align: center;
           white-space: pre-line; }
    #err { font-size: 13px; color: #ff6b7a; max-width: 480px; text-align: center;
           white-space: pre-line; word-break: break-word; }
    .badge { font-size: 11px; color: #7CFC00; }
    .hud { width: min(560px, 100%); border: 1px solid #12364d; border-radius: 12px;
           background: #020b12cc; padding: 12px; display: grid; gap: 8px; }
    .hud div { display: flex; justify-content: space-between; gap: 12px;
               font-size: 12px; color: #6d8aa5; }
    .hud strong { color: #cfe9ff; font-weight: 600; text-align: right; }
    #hudlog { max-height: 110px; overflow: auto; background: #01070c; color: #6d8aa5;
              border: 1px solid #0d2638; border-radius: 8px; padding: 8px;
              font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
              white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>JARVIS v2 — TESTE DE VOZ <span style="color:#4a6a85;font-size:11px">build v6</span></h1>
  <div id="orb">off</div>
  <div id="detail"></div>
  <div class="hud">
    <div><span>Estado</span><strong id="hudstate">desconectado</strong></div>
    <div><span>Tarefa</span><strong id="task">—</strong></div>
    <div><span>HUD</span><strong id="hudlink">aguardando</strong></div>
    <pre id="hudlog"></pre>
  </div>
  <button id="btn">Conectar</button>
  <div class="badge" id="aec"></div>
  <div class="badge" id="vu"></div>
  <div id="log">iPhone: confira o interruptor lateral de silêncio e o volume.\nFone de ouvido recomendado para o primeiro teste.</div>
  <div id="err"></div>
  <audio id="botaudio" autoplay playsinline></audio>

<script>
// Diagnóstico visível: NENHUM erro pode morrer em silêncio (Safari!).
(function () {
  var box = function () { return document.getElementById('err'); };
  window.onerror = function (msg, src, line) {
    box().textContent = '⚠ JS: ' + msg + ' (linha ' + line + ')';
    return false;
  };
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason || {};
    box().textContent = '⚠ Promessa: ' + (r.name ? r.name + ': ' : '') +
                        (r.message || String(r));
  });
})();
</script>

<script>
document.getElementById('log').textContent = '✅ JavaScript ATIVO — pode tocar em Conectar';
const btn = document.getElementById('btn');
const orb = document.getElementById('orb');
const log = (t) => document.getElementById('log').textContent = t;
let pc = null;
let hudTimer = null;
let dcPingTimer = null;

const STATE_PT = {
  idle: 'em espera', listening: 'ouvindo', thinking: 'pensando',
  speaking: 'falando', executing_tool: 'executando',
  observing_screen: 'observando tela', proactive_waiting: 'de prontidão',
  error_recovery: 'recuperando',
};

function applyState(state, detail, source) {
  orb.className = state || 'idle';
  orb.textContent = STATE_PT[state] || state || 'em espera';
  document.getElementById('detail').textContent =
    state === 'executing_tool' && detail ? `🔧 ${detail}` : (detail || '');
  document.getElementById('hudstate').textContent = STATE_PT[state] || state || '—';
  document.getElementById('task').textContent =
    ['executing_tool', 'observing_screen', 'thinking'].includes(state) && detail ? detail : '—';
  if (source) document.getElementById('hudlink').textContent = source;
}

function renderHudLogs(logs) {
  if (!Array.isArray(logs)) return;
  const lines = logs.slice(-8).map((l) => {
    const ts = typeof l.ts === 'number'
      ? new Date(l.ts * 1000).toLocaleTimeString()
      : String(l.ts || '').slice(-8);
    return `${ts} ${l.type || 'log'}: ${l.message || ''}`;
  });
  document.getElementById('hudlog').textContent = lines.join('\n');
}

async function pollHud() {
  try {
    const resp = await fetch('/api/jarvis/hud', { cache: 'no-store' });
    if (!resp.ok) throw new Error(resp.status);
    const hud = await resp.json();
    const p = hud.presence || {};
    applyState(p.state, p.detail || hud.current_task || '', 'HTTP fallback');
    renderHudLogs(hud.logs || []);
  } catch (_) {
    document.getElementById('hudlink').textContent = 'sem HUD HTTP';
  }
}

function startHudPolling() {
  stopHudPolling();
  pollHud();
  hudTimer = setInterval(pollHud, 1500);
}

function stopHudPolling() {
  if (hudTimer) clearInterval(hudTimer);
  hudTimer = null;
  if (dcPingTimer) clearInterval(dcPingTimer);
  dcPingTimer = null;
}

// ── iOS: a saída de áudio SÓ toca se for destravada DENTRO do gesto ─────
// O ontrack chega depois, fora do gesto — play() lá seria bloqueado pelo
// autoplay do Safari. Destravamos o <audio> e um AudioContext aqui.
let actx = null;
function unlockAudio() {
  const a = document.getElementById('botaudio');
  try { a.play().catch(() => {}); } catch (_) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (_) {}
}

// medidor: prova VISÍVEL de que o áudio do bot está chegando — separa
// "não chega áudio" de "chega mas o iPhone está no silencioso"
function vuMeter(stream) {
  try {
    if (!actx) return;
    const src = actx.createMediaStreamSource(stream);
    const an = actx.createAnalyser(); an.fftSize = 256;
    src.connect(an);                 // analyser só observa (sem eco duplo)
    const buf = new Uint8Array(an.frequencyBinCount);
    const el = document.getElementById('vu');
    let quietFrames = 0;
    (function loop() {
      if (!pc) { el.textContent = ''; return; }
      an.getByteFrequencyData(buf);
      let m = 0; for (const v of buf) if (v > m) m = v;
      if (m > 24) { el.textContent = '🔊 áudio do JARVIS chegando'; quietFrames = 0; }
      else if (++quietFrames > 90) el.textContent = '';
      requestAnimationFrame(loop);
    })();
  } catch (_) {}
}

const conectar = async () => {
  document.getElementById('log').textContent = '⏳ toque recebido — pedindo microfone…';
  if (pc) {
    stopHudPolling();
    pc.close(); pc = null; btn.textContent = 'Conectar';
    orb.className=''; orb.textContent='off';
    applyState('idle', '', 'desconectado');
    return;
  }
  btn.disabled = true;
  unlockAudio();               // AINDA no gesto do toque — antes de qualquer await
  try {
    // O ponto central deste cliente: processamento do navegador LIGADO
    // explicitamente (o cliente pré-pronto não define nada).
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl:  true,
        channelCount: 1,
      }
    });
    const track = stream.getAudioTracks()[0];
    const st = track.getSettings();
    document.getElementById('aec').textContent =
      `AEC=${st.echoCancellation} NS=${st.noiseSuppression} AGC=${st.autoGainControl}`;

    pc = new RTCPeerConnection();
    pc.addTrack(track, stream);
    pc.addTransceiver('audio', { direction: 'recvonly' });

    // ── HUD ao vivo: Presence Engine do servidor → data channel ──────────
    const dc = pc.createDataChannel('jarvis');
    dc.onopen = () => {
      document.getElementById('hudlink').textContent = 'data channel';
      dcPingTimer = setInterval(() => {
        try { dc.send('ping'); } catch (_) {}
      }, 1000);
    };
    dc.onerror = () => { document.getElementById('hudlink').textContent = 'fallback HTTP'; };
    dc.onclose = () => { document.getElementById('hudlink').textContent = 'fallback HTTP'; };
    dc.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type !== 'jarvis-state') return;      // ignora outros protocolos
      applyState(m.state, m.detail || '', 'data channel');
      renderHudLogs([{
        ts: Date.now() / 1000,
        type: 'presence',
        message: `${m.state}${m.detail ? ' — ' + m.detail : ''}`,
      }]);
    };
    pc.ontrack = (e) => {
      const a = document.getElementById('botaudio');
      a.srcObject = e.streams[0];
      // NUNCA engolir a rejeição: se o iOS bloquear, avisa e destrava no
      // próximo toque em qualquer lugar da tela.
      const tryPlay = () => a.play().then(() => {
        document.getElementById('err').textContent = '';
      }).catch((err) => {
        document.getElementById('err').textContent =
          '⚠ Áudio bloqueado pelo navegador (' + err.name +
          '). Toque em qualquer lugar da tela para liberar.';
        document.addEventListener('touchend', tryPlay, { once: true });
        document.addEventListener('click', tryPlay, { once: true });
      });
      tryPlay();
      vuMeter(e.streams[0]);
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        orb.className='on'; orb.textContent='ouvindo';
        log('Conectado — fale naturalmente. Interrompa falando por cima.');
        startHudPolling();
      }
      if (['failed','disconnected','closed'].includes(pc.connectionState)) {
        stopHudPolling(); orb.className=''; orb.textContent='off';
      }
    };

    log('Criando oferta WebRTC…');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log('Coletando candidatos ICE…');
    // vanilla ICE: espera terminar a coleta (com teto de 4s — host candidates
    // locais chegam em ms; STUN inacessível não pode travar o fluxo)
    await new Promise((res) => {
      const t = setTimeout(res, 4000);
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); return res(); }
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
      });
    });

    log('Enviando oferta ao servidor…');
    // Aberto por file:// (duplo clique)? Aponta para o servidor local
    // explicitamente — o CORS do runner é liberado.
    const base = window.location.protocol === 'file:'
        ? 'http://localhost:7860' : window.location.origin;
    const url = base + '/api/offer';
    let resp;
    try {
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
      });
    } catch (fe) {
      throw new Error(`fetch para ${url} falhou (${fe.name}: ${fe.message}). ` +
        'Verifique extensões (adblock), modo "somente HTTPS" do Chrome, ' +
        'ou recarregue com Ctrl+Shift+R.');
    }
    if (!resp.ok) throw new Error(`servidor respondeu ${resp.status}`);
    log('Aplicando resposta…');
    const answer = await resp.json();
    await pc.setRemoteDescription(answer);
    btn.textContent = 'Desconectar';
  } catch (e) {
    document.getElementById('err').textContent =
      '⚠ ' + (e.name ? e.name + ': ' : '') + e.message;
    log('Falhou — leia o erro acima e me mande.');
    if (pc) { stopHudPolling(); pc.close(); pc = null; }
  } finally {
    btn.disabled = false;
  }
};
btn.addEventListener('click', conectar);
btn.addEventListener('touchend', (e) => { e.preventDefault(); conectar(); });
</script>
</body>
</html>
